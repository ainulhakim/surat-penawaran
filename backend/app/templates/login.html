<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk &middot; {{ app_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body class="login-wrap">
  <div class="login-card">
    <div class="text-center text-white mb-3">
      <i class="bi bi-envelope-paper-fill" style="font-size:2.4rem"></i>
      <h5 class="mt-2 mb-0 fw-bold">Surat Penawaran Multi Wilayah</h5>
      <small class="text-white-50">Pusat &amp; Wilayah</small>
    </div>
    <div class="card">
      <div class="card-body p-4">
        {% if request.query_params.get('msg') %}
        <div class="alert alert-success py-2 small">{{ request.query_params.get('msg') }}</div>
        {% endif %}
        {% if err %}
        <div class="alert alert-danger py-2 small">{{ err }}</div>
        {% endif %}
        <form method="post" action="/login" autocomplete="on">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" name="email" required autofocus>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" name="password" required>
            </div>
          </div>
          <button class="btn btn-primary w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-1"></i>Masuk
          </button>
        </form>
      </div>
    </div>
    <p class="text-center text-white-50 small mt-3 mb-0">&copy; {{ today.year }} Sigit Platform</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
