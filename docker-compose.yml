services:
  db:
    image: postgres:16-alpine
    container_name: sp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sp_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-surat_penawaran}
    volumes:
      - sp_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sp_user} -d ${POSTGRES_DB:-surat_penawaran}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: sp-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sp_user}:${POSTGRES_PASSWORD:-sp_pass_change_me}@db:5432/${POSTGRES_DB:-surat_penawaran}
    volumes:
      - sp_uploads:/app/uploads
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  sp_pgdata:
  sp_uploads:
